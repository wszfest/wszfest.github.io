<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West Stockbridge Zucchini Festival 2027</title>
<meta name="description" content="West Stockbridge Zucchini Festival 2027 — volunteer sign-ups and festival links.">
<meta property="og:title" content="West Stockbridge Zucchini Festival 2027">
<meta property="og:description" content="Volunteer sign-ups and festival links.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#1f3d33">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1f3d33; --cream:#f6f1de; --gold:#dec362; --mint:#9fd0b9; --line:#5f9c84; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: 'Work Sans', system-ui, sans-serif; }
  main { min-height: 100vh; display: flex; justify-content: center; padding: 48px 20px 40px; }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .logo { width: 248px; max-width: 70%; height: auto; display: block; }
  header { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 42px; line-height: 1.08; }
  .sub { margin: 0; font-size: 17px; line-height: 1.5; color: #cfdccf; }
  nav { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .btn { display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 14px 20px; border-radius: 14px; text-decoration: none; transition: transform .12s ease, background-color .12s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn svg { flex: none; }
  .primary { min-height: 76px; padding: 16px 20px; background: var(--gold); color: var(--bg); }
  .primary .t { font-size: 19px; font-weight: 600; line-height: 1.2; }
  .primary .s { font-size: 14px; line-height: 1.3; color: #2f4f43; }
  .label { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .secondary { border: 2px solid var(--line); color: var(--cream); font-size: 17px; font-weight: 500; }
  .secondary:hover { background: #28503f; }
  footer { margin-top: 8px; text-align: center; font-size: 14px; color: #a9bfb2; }
  footer p { margin: 0; }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="West Stockbridge Zucchini Festival logo: a zucchini with its blossom and curling vines on a blue circle">

    <header>
      <p class="eyebrow">West Stockbridge, Massachusetts</p>
      <h1>Zucchini Festival 2027</h1>
      <!-- Add the date when it's set:
      <p class="sub">Saturday, August 14 · Downtown West Stockbridge</p>
      -->
    </header>

    <nav aria-label="Festival links">
      <a class="btn primary" href="https://www.signupgenius.com/go/10C0B4AAAA92FA0F5C34-67744977-2027">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="label"><span class="t">Volunteer with us</span><span class="s">Pick a shift on SignUpGenius</span></span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <!-- More buttons: copy this block, change the link and the text.
      <a class="btn secondary" href="https://example.com">
        <span class="label">Schedule &amp; festival info</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9fd0b9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      -->
    </nav>

    <footer><p>West Stockbridge Zucchini Festival · 2027</p></footer>
  </div>
</main>
</body>
</html>
